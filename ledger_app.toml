[app]
build_directory = "./"
sdk = "C"
devices = ["nanox", "nanos+", "stax", "flex", "apex_p"]

[use_cases]
memory_profiling = "DEBUG=1 MEMORY_PROFILING=1"

[unit_tests]
directory = "./tests/unit/"

[pytest.standalone]
directory = "./tests/standalone/"

[pytest.swap]
directory = "./tests/swap/"
[pytest.swap.dependencies]
testing_with_latest = [
    { url = "https://github.com/LedgerHQ/app-exchange-dev", ref = "develop", use_case = "dbg_use_test_keys" },
    { url = "https://github.com/LedgerHQ/app-ethereum-dev", ref = "develop", use_case = "use_test_keys" },
]
