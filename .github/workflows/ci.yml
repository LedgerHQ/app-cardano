name: CI

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build and test app for all supported devices
    strategy:
      fail-fast: false
      matrix:
        device: ["nanox", "nanosp", "stax", "flex", "apex_p"]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Build application in developer + headless mode
        shell: bash
        run: |
          eval "BOLOS_SDK=\$$(echo ${{ matrix.device }} | tr [:lower:] [:upper:])_SDK" && \
          echo "BOLOS_SDK value will be: ${BOLOS_SDK}" && \
          BOLOS_SDK=${BOLOS_SDK} DEVEL=1 DEFINES+=HEADLESS make
          echo "Build complete"
      - name: Install Node.js
        # lsof is required by the third-party test-speculos.sh to probe Speculos port readiness
        run: apt-get update && apt-get install --no-install-recommends -y nodejs npm g++ lsof
      - name: Install yarn
        run: npm install --global yarn
      - name: Install Cardano JS Library
        run: git clone https://github.com/vacuumlabs/ledgerjs-cardano-shelley.git
      - name: Run tests
        # The Cardano JS library is a third-party repo; its lockfile/resolutions are
        # not under our control, so disable Yarn's hardened mode (auto-enabled on
        # public PRs) which rejects one of its resolutions.
        env:
          YARN_ENABLE_HARDENED_MODE: "false"
        run: |
          BUILD_DEVICE_NAME="$(echo ${{ matrix.device }} | sed 's/nanosp/nanos2/')"
          # test-speculos.sh launches and manages Speculos itself; it locates the
          # app via APP_ELF (otherwise it falls back to a hard-coded sibling path).
          export APP_ELF="$GITHUB_WORKSPACE/build/$BUILD_DEVICE_NAME/bin/app.elf"
          cd ledgerjs-cardano-shelley &&
          yarn install &&
          yarn test-speculos
